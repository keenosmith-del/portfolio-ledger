# Only behind verified HTTPS ingress; published port binds to loopback.
server {
  listen 8080;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 30s;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 9m;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header Referrer-Policy "same-origin" always;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; }
  location /ready { proxy_pass http://api:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; }
  location / { try_files $uri /index.html; }
}
