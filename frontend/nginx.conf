server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 9m;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /ready { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
}
